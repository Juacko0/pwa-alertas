<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alertas del Día</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>🚨 Alertas del Día</h1>
      <button id="btnLogout" class="btn-logout">Cerrar sesión</button>
    </header>

    <section id="alertas-lista" class="alertas-lista">
      <p class="sin-alertas">Cargando alertas...</p>
    </section>
  </div>

  <!-- MODAL DE ATENCIÓN -->
  <div id="modalAtencion" class="modal">
    <div class="modal-content">
      <h3>🚨 Nueva Alerta</h3>
      <p><b>Ubicación:</b> <span id="modalUbicacion"></span></p>

      <label>⚠️ Nivel de lesión:</label>
      <select id="nivelLesion">
        <option value="1">Leve</option>
        <option value="2">Moderada</option>
        <option value="3">Grave</option>
      </select>

      <textarea id="comentarioAdicional" placeholder="Escribe los detalles de la atención..."></textarea>

      <div class="modal-buttons">
        <button id="btnCancelarModal" class="btn-cancelar">Cancelar</button>
        <button id="btnRegistrarAtencion" class="btn-confirmar">Aceptar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
