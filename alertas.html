<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alertas del Día</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>🚨 Alertas del Día</h1>
      <button id="btnLogout" class="btn-logout">Cerrar sesión</button>
    </header>

    <section id="alertas-lista" class="alertas-lista">
      <p class="sin-alertas">Cargando alertas...</p>
    </section>
  </div>

  <!-- MODAL DE ATENCIÓN (se muestra/oculta desde JS) -->
  <div id="modalAtencion" class="modal" aria-hidden="true">
    <div class="modal-content">
      <h3>🚨 Nueva Alerta</h3>

      <label>📍 Ubicación</label>
      <input id="input-location" type="text" placeholder="Ej: Hab. 2A">

      <label>👤 Residente</label>
      <input id="input-resident" type="text" placeholder="Nombre del residente">

      <label>📝 Descripción</label>
      <textarea id="input-detail" rows="3" placeholder="Describe el incidente..."></textarea>

      <div class="row">
        <div class="col">
          <label>💥 Fue una caída real</label>
          <input id="input-isFall" type="checkbox">
        </div>
        <div class="col">
          <label>🩺 Hubo intervención</label>
          <input id="input-huboIntervencion" type="checkbox">
        </div>
      </div>

      <label>⚕️ Nivel de lesión</label>
      <select id="input-injuryLevel">
        <option value="1">1 - Leve</option>
        <option value="2">2 - Moderada</option>
        <option value="3">3 - Grave</option>
      </select>

      <label>📝 Comentario adicional</label>
      <textarea id="input-detalleExtra" rows="3" placeholder="Detalles adicionales..."></textarea>

      <div class="modal-buttons">
        <button id="btnCancelarModal" class="btn-cancelar">Cancelar</button>
        <button id="btnRegistrarAtencion" class="btn-confirmar">Registrar Atención</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
