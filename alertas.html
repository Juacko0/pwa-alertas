<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alertas Activas</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <header class="topbar">
    <h2>🚨 Alertas del Día</h2>
    <button id="btnLogout">Cerrar sesión</button>
  </header>

  <main id="alertas-lista" class="alertas-container">
    <p>Cargando alertas...</p>
  </main>

  <!-- Modal único -->
  <div id="modalAtencion" class="modal">
    <div class="modal-content">
      <h3>Registrar atención</h3>
      <p id="modalUbicacion" style="font-weight: 500;"></p>
      <textarea id="comentarioAdicional" placeholder="Comentario adicional..."></textarea>
      <div class="modal-buttons">
        <button id="btnRegistrarAtencion">Aceptar</button>
        <button id="btnCancelarModal" class="btn-cancelar">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Escuchar mensajes del Service Worker
    if (navigator.serviceWorker) {
      navigator.serviceWorker.addEventListener("message", (event) => {
        if (event.data?.tipo === "alerta") {
          window.postMessage(event.data, "*");
        }
      });
    }
  </script>
</body>
</html>
